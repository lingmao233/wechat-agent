[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-agent"
version = "0.1.0"
description = "Windows Weixin 4.1.x UIAutomation agent with scoped memory and guarded replies"
requires-python = ">=3.11"
dependencies = [
  "comtypes>=1.4.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "python-dotenv>=1.0.0",
  "pyperclip>=1.8.2",
  "SQLAlchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "pgvector>=0.3.0",
  "alibabacloud-oss-v2==1.4.0",
  "wechatauto-replica==1.2.7.0; sys_platform == 'win32'",
  "uiautomation>=2.0.18; sys_platform == 'win32'",
  "playwright>=1.48.0",
]

[project.scripts]
wechat-agent = "wechat_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
